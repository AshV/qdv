<!DOCTYPE html>
<html>

<head>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
    <title>{{page.title}} | Query Dataverse</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

    <script>
        var query = "";

        GetQuery()
            .then(response => { query = response; })
            .catch(error => { alert("Unexpected Error Occured!"); });

        async function GetQuery() {
            const response = await fetch("https://raw.githubusercontent.com/AshV/QueryDataverse/main/Queries/{{page.queryName}}/fetch.xml");
            return await response.text();
        }
    </script>
</head>

<body>
    <nav class="custom-navbar">
        <div class="brand">
            <a href="{{ '/' | relative_url }}">Query Dataverse</a>
        </div>
        <ul>
            <li><a href="https://github.com/AshV/qdv" class="nav-link" target="_blank">Github</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>{{page.title}}</h1>
        <hr style="opacity: 0.1; margin: 2rem 0;">

        <div class="env-selector-card">
            <h3>Environment Selector</h3>
            <p>Select Environment & Click Here To Run Query</p>

            <div class="env-input-group">
                <input id="txtEnv" type="url" placeholder="https://org.crm8.dynamics.com" autofocus />
                <input id="btnAddEnv" type="button" class="btn-primary" value="Add Environment" />
            </div>

            <div id="envList" class="env-tags">
                <!-- Tags will be injected here -->
            </div>

            <div style="margin-top: 1rem; text-align: right;">
                <a role="button" id="btnRunQuery" class="btn-primary" onclick="runQueryCheck()"
                    style="text-decoration: none; display: inline-block;">Run Query</a>
            </div>
        </div>

        <p>To improve this query, please join disussion <a
                href="https://github.com/AshV/qdv/discussions/{{page.discussionId}}">here</a>.</p>

        <!--Code Tabs-->
        <div class="custom-tabs">
            <div class="tab-headers">
                <div class="tab-header active" data-target="tabFetchXML">FetchXML</div>
                <div class="tab-header" data-target="tabWebAPI">WebAPI</div>
                <div class="tab-header" data-target="tabSQL">SQL</div>
            </div>

            <div id="tabFetchXML" class="tab-content active">
                <iframe frameborder="0" scrolling="no" class="code-frame" allow="clipboard-write"
                    src="https://emgithub.com/iframe.html?target=https://github.com/AshV/Query-Dataverse/blob/main/Queries/{{page.queryName}}/fetch.xml&style=github-dark&type=code&showBorder=on&showLineNumbers=on&showFileMeta=on&showFullPath=on&showCopy=on&fetchFromJsDelivr=on"></iframe>
            </div>
            <div id="tabWebAPI" class="tab-content">
                <iframe frameborder="0" scrolling="no" class="code-frame" allow="clipboard-write"
                    src="https://emgithub.com/iframe.html?target=https://github.com/AshV/Query-Dataverse/blob/main/Queries/{{page.queryName}}/webapi.odata&style=github-dark&type=code&showBorder=on&showLineNumbers=on&showFileMeta=on&showFullPath=on&showCopy=on&fetchFromJsDelivr=on"></iframe>
            </div>
            <div id="tabSQL" class="tab-content">
                <iframe frameborder="0" scrolling="no" class="code-frame" allow="clipboard-write"
                    src="https://emgithub.com/iframe.html?target=https://github.com/AshV/Query-Dataverse/blob/main/Queries/{{page.queryName}}/tds.sql&style=github-dark&type=code&showBorder=on&showLineNumbers=on&showFileMeta=on&showFullPath=on&showCopy=on&fetchFromJsDelivr=on"></iframe>
            </div>
        </div>

        <footer>
            <p style="text-align:center">
                <a target="_blank" id="buildQuery" href="https://github.com/AshV/qdv"
                    style="font-size: 2rem; text-decoration: none;">🕉️</a><br>
                Built with ❤️ by <a href="https://www.linkedin.com/in/ashishvishwakarma-ashv/">AshV</a>
            </p>
        </footer>
    </div>

    <script>
        let orgURLs = {};
        let addURL = document.querySelector("#btnAddEnv");
        let orgURL = document.querySelector("#txtEnv");
        let buildQuery = document.querySelector("#buildQuery");
        // Removed apiVersion unused var

        if (localStorage.getItem("lsOrgURLs") !== null) {
            orgURLs = JSON.parse(localStorage.getItem("lsOrgURLs"));
            renderOrgList();
        }

        orgURL.onchange = function () {
            if (orgURL.value.length === 0)
                return;
            if (isValidURL(orgURL.value)) {
                var url = new URL(orgURL.value);
                orgURL.value = url.origin;
            } else {
                alert("Please enter a valid URL.");
            }
        };

        addURL.onclick = function () {
            if (isValidURL(orgURL.value)) {
                let url = new URL(orgURL.value);
                orgURL.value = url.origin;
                let orgName = url.hostname.split('.')[0];
                orgURLs[orgName] = url.origin;
                localStorage.setItem("lsOrgURLs", JSON.stringify(orgURLs));
                renderOrgList(orgName);
                orgURL.value = ""; // Clear input
            } else {
                alert("Please enter a valid URL.");
            }
        };

        function runQueryCheck() {
            if (!isValidURL(orgURL.value) || orgURL.value === null) {
                // Try to pick selected? The logic here is a bit weird in original.
                // It relies on orgURL input having a value.
                // If the user clicked a tag, onChangeEnv sets the input.
                alert("Please select or enter a valid organization URL.");
            }
            else {
                buildQuery.href = `${orgURL.value}/api/data/v9.2/{{page.tablePlural}}?fetchXml=${query}`;
                buildQuery.click();
            }
        };

        function isValidURL(str) {
            regexp = /^(?:(?:https?|ftp):\/\/)?(?:(?!(?:10|127)(?:\.\d{1,3}){3})(?!(?:169\.254|192\.168)(?:\.\d{1,3}){2})(?!172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2})(?:[1-9]\d?|1\d\d|2[01]\d|22[0-3])(?:\.(?:1?\d{1,2}|2[0-4]\d|25[0-5])){2}(?:\.(?:[1-9]\d?|1\d\d|2[0-4]\d|25[0-4]))|(?:(?:[a-z\u00a1-\uffff0-9]-*)*[a-z\u00a1-\uffff0-9]+)(?:\.(?:[a-z\u00a1-\uffff0-9]-*)*[a-z\u00a1-\uffff0-9]+)*(?:\.(?:[a-z\u00a1-\uffff]{2,})))(?::\d{2,5})?(?:\/\S*)?$/;
            return regexp.test(str) ? true : false;
        };

        function onChangeEnv(env) {
            orgURL.value = env.getAttribute('value'); // Use getAttribute for safety
            document.querySelectorAll(".env-tag").forEach(elem => elem.style.border = "none");
            // Highlight logic
            env.style.border = "2px solid var(--primary-color)";
        };

        function removeEnv(event, key) {
            event.stopPropagation();
            delete orgURLs[key];
            localStorage.setItem("lsOrgURLs", JSON.stringify(orgURLs));
            renderOrgList();
        };

        function renderOrgList() {
            let orgsHTML = '';
            for (let [key, value] of Object.entries(orgURLs)) {
                orgsHTML += `<div class="env-tag" onclick="onChangeEnv(this);" value="${value}" title="${value}">
                                ${key} 
                                <span class="remove" onclick="removeEnv(event, '${key}')">×</span>
                             </div>`;
            }
            document.querySelector("#envList").innerHTML = orgsHTML;
        };

        // Improved Tab Logic
        const tabHeaders = document.querySelectorAll('.tab-header');
        const tabContents = document.querySelectorAll('.tab-content');

        tabHeaders.forEach(header => {
            header.addEventListener('click', () => {
                // Remove active class from all
                tabHeaders.forEach(h => h.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));

                // Add to current
                header.classList.add('active');
                const targetId = header.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>
</body>

</html>
